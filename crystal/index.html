<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Whaling City Ford — AI Sales Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap');
:root{
  --r:#003478;--rd:#002255;--rl:#eff6ff;--rxl:#fff8f9;
  --g:#f4f4f4;--gm:#e0e0e0;--gd:#555;
  --w:#fff;--tx:#1a1a1a;--mu:#888;
  --f:'Barlow',sans-serif;--fd:'Barlow Condensed',sans-serif;
  --ra:14px;--sh:0 12px 48px rgba(0,0,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;}

/* LAUNCHER */
#gnl{position:fixed;bottom:24px;right:24px;width:64px;height:64px;border-radius:50%;background:#003478;border:none;cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;z-index:9998;transition:transform .2s,background .2s;}
#gnl:hover{background:#002255;transform:scale(1.08);}
#gnl svg{width:30px;height:30px;fill:white;}
.ndot{position:absolute;top:5px;right:5px;width:13px;height:13px;border-radius:50%;background:#4ade80;border:2.5px solid white;animation:pd 2s infinite;}
@keyframes pd{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

/* CHAT WINDOW */
#gnc{position:fixed;bottom:104px;right:24px;width:410px;height:700px;border-radius:var(--ra);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;z-index:9999;font-family:var(--f);background:var(--w);transform:scale(.87) translateY(32px);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;}
#gnc.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}

/* HEADER */
.hdr{background:#003478;padding:12px 14px 10px;flex-shrink:0;}
.hdr-t{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hlog{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:14px;font-weight:700;color:#003478;flex-shrink:0;}
.hname{font-family:var(--fd);font-size:16px;font-weight:700;color:white;letter-spacing:.3px;line-height:1.1;}
.hsub{font-size:11px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:5px;margin-top:2px;}
.lv{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pd 2s infinite;display:inline-block;}
.hright{display:flex;align-items:center;gap:6px;margin-left:auto;}
.ltog{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden;}
.lb{padding:4px 10px;font-size:11px;font-family:var(--f);font-weight:600;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.7);transition:all .15s;}
.lb.active{background:white;color:#003478;}
.xb{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;color:white;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.xb:hover{background:rgba(255,255,255,.3);}
.scr{display:flex;align-items:center;gap:8px;}
.slbl{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap;min-width:90px;}
.strk{flex:1;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;}
.sfil{height:100%;border-radius:3px;width:0%;transition:width .6s,background .6s;background:#f87171;}

/* LIVE TAKEOVER BANNER */
.takeover-bar{background:#166534;color:white;padding:7px 14px;font-size:12px;font-weight:500;display:none;align-items:center;gap:8px;flex-shrink:0;}
.takeover-bar.active{display:flex;}
.tk-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pd 1s infinite;flex-shrink:0;}

/* LEAD BAR */
.lb-bar{background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:5px 12px;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.lb-bar::-webkit-scrollbar{display:none;}
.lc{display:flex;flex-direction:column;background:white;border:1px solid #bfdbfe;border-radius:7px;padding:3px 8px;min-width:62px;flex-shrink:0;transition:border-color .3s,background .3s;}
.lc.on{border-color:#003478;background:var(--rxl);}
.lc .ll{font-size:9px;color:#bbb;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.lc .lv2{font-size:11px;color:#002255;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px;}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f9f9f9;scrollbar-width:thin;}
.msg{display:flex;gap:7px;max-width:92%;animation:fi .2s ease;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.agent{opacity:.95;}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.av{width:28px;height:28px;border-radius:50%;background:#003478;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:10px;font-weight:700;color:white;flex-shrink:0;margin-top:2px;}
.av.human{background:#166534;}
.bbl{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.58;color:var(--tx);}
.msg.bot .bbl{background:white;border:1px solid #ebebeb;border-radius:4px 16px 16px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.msg.user .bbl{background:#003478;color:white;border-radius:16px 4px 16px 16px;}
.msg.agent .bbl{background:#f0fdf4;border:1px solid #86efac;border-radius:4px 16px 16px 16px;}
.qrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.qb{font-size:12px;font-family:var(--f);padding:5px 11px;border:1.5px solid #bfdbfe;border-radius:20px;background:white;color:#002255;cursor:pointer;transition:all .12s;white-space:nowrap;font-weight:500;}
.qb:hover{background:#eff6ff;border-color:#003478;}
.qb:disabled{opacity:.35;cursor:default;}

/* INVENTORY CARDS */
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.inv-card{background:white;border:1.5px solid #ebebeb;border-radius:10px;padding:11px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.inv-card:hover{border-color:#003478;box-shadow:0 2px 12px rgba(200,16,46,.1);}
.inv-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:6px;}
.inv-badge.new-b{background:#dcfce7;color:#166534;}
.inv-badge.cpo-b{background:#dbeafe;color:#1e40af;}
.inv-badge.hot-b{background:#dbeafe;color:#991b1b;}
.inv-name{font-size:13px;font-weight:700;color:var(--tx);line-height:1.2;margin-bottom:3px;}
.inv-trim{font-size:11px;color:var(--mu);margin-bottom:6px;}
.inv-price{font-size:14px;font-weight:700;color:#003478;font-family:var(--fd);}
.inv-mo{font-size:10px;color:var(--mu);}
.inv-feats{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.inv-feat{font-size:10px;background:#f4f4f4;border-radius:4px;padding:2px 5px;color:var(--gd);}
.inv-cta{background:#003478;color:white;border:none;border-radius:7px;padding:7px;font-size:12px;font-family:var(--f);font-weight:600;cursor:pointer;width:100%;margin-top:8px;transition:background .15s;}
.inv-cta:hover{background:#002255;}

/* APPOINTMENT CARD */
.apt-card{background:white;border:1px solid #ebebeb;border-radius:12px;padding:14px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.apt-title{font-family:var(--fd);font-size:14px;font-weight:700;color:#002255;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.apt-sub{font-size:11px;color:var(--mu);margin-bottom:10px;line-height:1.4;}
.apt-slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.apt-slot{padding:9px 7px;border:1.5px solid #ebebeb;border-radius:9px;font-size:11px;text-align:center;cursor:pointer;transition:all .15s;background:white;}
.apt-slot:hover{border-color:#003478;background:#eff6ff;}
.apt-slot.pk{background:#003478;color:white;border-color:#003478;}
.apt-slot .sd{font-weight:700;font-size:12px;}
.apt-slot .st{font-size:10px;opacity:.8;margin-top:1px;}
.apt-slot .su{font-size:9px;opacity:.7;color:#f87171;}
.apt-slot.pk .su{color:rgba(255,255,255,.8);}
.apt-urgency{background:#dbeafe;border:1px solid #fca5a5;border-radius:8px;padding:8px 10px;font-size:11px;color:#991b1b;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.apt-confirm-btn{background:#003478;color:white;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-family:var(--f);font-weight:600;cursor:pointer;width:100%;transition:background .15s;}
.apt-confirm-btn:hover{background:#002255;}
.apt-confirm-btn:disabled{opacity:.45;cursor:default;}
.apt-confirmed{text-align:center;padding:14px 10px;}
.apt-confirmed .ck{font-size:28px;margin-bottom:6px;}
.apt-confirmed .ct{font-weight:700;color:#002255;font-size:14px;font-family:var(--fd);}
.apt-confirmed .cd{font-size:12px;color:var(--mu);margin-top:4px;}

/* TRADE-IN CARD */
.tc{background:white;border:1px solid #ebebeb;border-radius:12px;padding:13px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.tc-ttl{font-family:var(--fd);font-size:14px;font-weight:700;color:#002255;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.tc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.tc-lbl{font-size:12px;color:var(--mu);font-weight:500;}
.tc-val{font-size:13px;font-weight:700;color:var(--tx);}
.tc-sel{font-size:12px;border:1px solid var(--gm);border-radius:6px;padding:3px 8px;background:white;font-family:var(--f);outline:none;}
.tc-sel:focus{border-color:#003478;}
input[type=range].tcr{width:100%;margin:4px 0 8px;accent-color:#003478;}
.tc-res{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:9px;padding:11px;text-align:center;margin-top:9px;}
.tc-res .big{font-size:24px;font-weight:700;color:#003478;font-family:var(--fd);}
.tc-res .sm{font-size:11px;color:var(--mu);margin-top:3px;}
.tc-btn{background:#003478;color:white;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-family:var(--f);font-weight:600;cursor:pointer;width:100%;margin-top:10px;transition:background .15s;}
.tc-btn:hover{background:#002255;}

/* TYPING */
.typr{display:flex;gap:7px;max-width:92%;}
.typb{display:flex;gap:4px;align-items:center;padding:10px 13px;background:white;border:1px solid #ebebeb;border-radius:4px 16px 16px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.td{width:6px;height:6px;border-radius:50%;background:#ccc;animation:bop 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* INPUT */
.inpr{display:flex;gap:8px;padding:10px 13px;border-top:1px solid #ebebeb;background:white;flex-shrink:0;}
.inp{flex:1;padding:9px 13px;border:1.5px solid #e0e0e0;border-radius:22px;font-size:13.5px;font-family:var(--f);background:#fafafa;color:var(--tx);outline:none;transition:border-color .15s;}
.inp:focus{border-color:#003478;background:white;}
.sndb{width:40px;height:40px;border-radius:50%;background:#003478;border:none;cursor:pointer;color:white;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.sndb:hover{background:#002255;}
[dir="rtl"] .msg.bot{flex-direction:row-reverse;}
[dir="rtl"] .msg.user{flex-direction:row;}
[dir="rtl"] .msg.bot .bbl{border-radius:16px 4px 16px 16px;}
[dir="rtl"] .msg.user .bbl{border-radius:4px 16px 16px 16px;}
[dir="rtl"] .inp{text-align:right;}
[dir="rtl"] .qrow{direction:rtl;}
.gnftr{text-align:center;padding:5px;font-size:10px;color:#c0c0c0;background:white;border-top:1px solid #f0f0f0;flex-shrink:0;}
.gnftr a{color:#c0c0c0;text-decoration:none;}

/* EXPORT */
.expb{position:fixed;bottom:24px;left:24px;background:white;border:1px solid #e0e0e0;border-radius:10px;padding:9px 14px;font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;color:#002255;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:9997;display:flex;align-items:center;gap:6px;transition:background .15s;}
.expb:hover{background:#eff6ff;}

@media(max-width:440px){
  #gnc{width:calc(100vw - 16px);right:8px;bottom:88px;height:85vh;}
  #gnl{bottom:16px;right:16px;}
  .expb{display:none;}
}
</style>
</head>

<script>
// ════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════
const API_KEY = '';
const BACKEND      = 'https://your-backend.com';
const DEALER_PHONE = '+18603335641';

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let lang='en', messages=[], isTyping=false, chatOpen=false;
let leadScore=0, pickedSlot='', liveMode=false;
let ld={name:'',phone:'',email:'',vehicle:'',budget:'',finance:'',tradein:'',timeline:'',appt:'',objections:''};

// ════════════════════════════════════════════════════════════
//  LIVE INVENTORY  (replace with DMS API call in production)
// ════════════════════════════════════════════════════════════
const INVENTORY = [
  {id:'R24-001',model:'Rogue SV',year:2024,type:'new',price:32490,mo:299,color:'Pearl White',miles:0,mpg:'30/37',features:['AWD','Heated Seats','Apple CarPlay','ProPilot Assist'],stock:'In Stock',hot:true},
  {id:'R24-002',model:'Rogue SL',year:2024,type:'new',price:38990,mo:359,color:'Scarlet Ember',miles:0,mpg:'30/37',features:['AWD','Leather','Bose Audio','360-Camera'],stock:'2 Left',hot:true},
  {id:'A24-001',model:'Altima SR',year:2024,type:'new',price:28990,mo:259,color:'Gun Metallic',miles:0,mpg:'28/39',features:['Intelligent AWD','Sport Seats','CarPlay','Safety Shield'],stock:'In Stock',hot:false},
  {id:'A23-CPO',model:'Altima SV',year:2023,type:'cpo',price:24990,mo:219,color:'Brilliant Silver',miles:18400,mpg:'28/39',features:['CPO Warranty','1-Owner','Low Miles','Heated Seats'],stock:'1 Left',hot:false},
  {id:'S24-001',model:'Sentra SR',year:2024,type:'new',price:23490,mo:199,color:'Midnight Black',miles:0,mpg:'29/39',features:['Sport Package','CarPlay','Safety Shield','Moonroof'],stock:'In Stock',hot:false},
  {id:'F24-001',model:'Frontier SV',year:2024,type:'new',price:36990,mo:329,color:'Gun Metallic',miles:0,mpg:'18/24',features:['4x4','Tow Package','Bed Liner','Trail Pro'],stock:'3 Left',hot:false},
  {id:'P24-001',model:'Pathfinder SL',year:2024,type:'new',price:44990,mo:399,color:'Baja Storm',miles:0,mpg:'20/27',features:['7-Seat','AWD','Panoramic Roof','Leather'],stock:'2 Left',hot:true},
  {id:'AR24-001',model:'Ariya Venture+',year:2024,type:'new',price:42990,mo:379,color:'Aurora Green',miles:0,mpg:'216mi range',features:['EV','FWD','ProPilot 2.0','DC Fast Charge'],stock:'In Stock',hot:false},
  {id:'KK24-001',model:'Kicks SR',year:2024,type:'new',price:21990,mo:179,color:'Aspen White',miles:0,mpg:'28/36',features:['Compact SUV','CarPlay','Safety Shield','Style Pkg'],stock:'In Stock',hot:false},
];

function matchInventory(lead) {
  let scored = INVENTORY.map(v => {
    let s = 0;
    const vLow = (lead.vehicle||'').toLowerCase();
    const mLow = v.model.toLowerCase();
    if(vLow && mLow.includes(vLow.split(' ')[0])) s += 40;
    if(vLow.includes('suv') && ['rogue','pathfinder','kicks','ariya'].some(x=>mLow.includes(x))) s += 20;
    if(vLow.includes('truck') && mLow.includes('frontier')) s += 30;
    if(vLow.includes('ev') && mLow.includes('ariya')) s += 30;
    if(vLow.includes('sedan') && ['altima','sentra'].some(x=>mLow.includes(x))) s += 20;
    const budget = (lead.budget||'').replace(/[^0-9]/g,'');
    if(budget) {
      const b = parseInt(budget);
      if(b < 250 && v.mo <= 220) s += 15;
      else if(b < 350 && v.mo <= 320) s += 15;
      else if(b < 450 && v.mo <= 420) s += 15;
      else if(v.mo <= b+50) s += 10;
    }
    if(lead.finance === 'lease' && v.type === 'new') s += 10;
    if(lead.finance === 'finance' && v.type === 'cpo') s += 8;
    if(v.hot) s += 5;
    return {...v, score: s};
  });
  scored.sort((a,b) => b.score - a.score);
  return scored.slice(0,4);
}

function buildInventoryCards(lead) {
  const matches = matchInventory(lead);
  if(!matches.length) return '';
  const cards = matches.map(v => {
    const badge = v.type==='new'
      ? `<span class="inv-badge new-b">NEW</span>`
      : `<span class="inv-badge cpo-b">CPO</span>`;
    const hotBadge = v.hot ? `<span class="inv-badge hot-b" style="margin-left:4px;">🔥 Hot</span>` : '';
    const feats = v.features.slice(0,3).map(f=>`<span class="inv-feat">${f}</span>`).join('');
    const milesStr = v.miles > 0 ? `${v.miles.toLocaleString()} mi · ` : '';
    return `<div class="inv-card" onclick="selectVehicle('${v.year} ${v.model}', ${v.mo})">
      <div>${badge}${hotBadge}</div>
      <div class="inv-name">${v.year} Ford ${v.model}</div>
      <div class="inv-trim">${milesStr}${v.color} · ${v.stock}</div>
      <div class="inv-price">$${v.price.toLocaleString()}</div>
      <div class="inv-mo">or $${v.mo}/mo est.</div>
      <div class="inv-feats">${feats}</div>
      <button class="inv-cta" onclick="event.stopPropagation();selectVehicle('${v.year} ${v.model}',${v.mo})">

const APPT_URGENCY = [
  "⚡ We have 3 test drives scheduled this week — slots filling fast.",
  "⚡ Our lease special on this model ends in 4 days.",
  "⚡ Two other customers are looking at this same vehicle today.",
  "⚡ Our finance team has rate holds available — but they expire end of week.",

function buildAppointmentCard() {
  const t = lang==='en';
  const days = t ? ['Mon','Tue','Wed','Thu','Fri','Sat'] : ['Lun','Mar','Mié','Jue','Vie','Sáb'];
  const today = new Date();
  const urgency = APPT_URGENCY[Math.floor(Math.random() * APPT_URGENCY.length)];

  // Generate specific time slots for next 5 business days
  const timeOptions = [
    {time:'9:30 AM', label: t?'Morning':'Mañana'},
    {time:'11:00 AM', label: t?'Late Morning':'Media Mañana'},
    {time:'1:00 PM', label: t?'Lunch':'Mediodía'},
    {time:'2:30 PM', label: t?'Afternoon':'Tarde'},
    {time:'4:00 PM', label: t?'Late Afternoon':'Tarde'},
    {time:'5:30 PM', label: t?'Evening':'Noche'},
  ];

  const slots = [];
  for(let d=1; d<=8 && slots.length<6; d++) {
    const dt = new Date(today); dt.setDate(today.getDate()+d);
    if(dt.getDay()===0) continue;
    const dayLabel = days[dt.getDay()-1];
    const dateLabel = `${dt.getMonth()+1}/${dt.getDate()}`;
    const tOpt = timeOptions[slots.length % timeOptions.length];
    slots.push({day:dayLabel, date:dateLabel, time:tOpt.time, label:tOpt.label,
      full:`${dayLabel} ${dateLabel} at ${tOpt.time}`});
  }

  return `<div class="apt-card" id="apt-card">
    <div class="apt-title">📅 ${t?'Pick Your Test Drive Time':'Elige Tu Horario'}</div>
    <div class="apt-sub">${t
      ? 'Takes ~30 min. We\'ll have your vehicle pulled, gassed up, and ready before you arrive.'
      : 'Dura ~30 min. Tendremos tu vehículo listo antes de que llegues.'}</div>
    <div class="apt-urgency">${urgency}</div>
    <div class="apt-slots" id="apt-slots">
      ${slots.map((s,i)=>`<div class="apt-slot" id="s${i}" onclick="pickSlot(${i},'${s.full}')">
        <div class="sd">${s.day} ${s.date}</div>
        <div class="st">${s.time}</div>
      </div>`).join('')}
    </div>
    <button class="apt-confirm-btn" id="apt-cfm" onclick="confirmAppt()" disabled>
      ${t?'Confirm My Appointment →':'Confirmar Mi Cita →'}
    </button>
  </div>`;
}

// KBB-calibrated trade-in algorithm
// Mirrors KBB's published depreciation curves and condition band adjustments
function calcTrade() {
  const yr  = parseInt(document.getElementById('ti-yr')?.value  || new Date().getFullYear());
  const mi  = parseInt(document.getElementById('ti-mi')?.value  || 30000);
  const co  = document.getElementById('ti-co')?.value           || 'gd';
  const age = new Date().getFullYear() - yr;

  // KBB-style depreciation schedule
  const depTable = [1.00,0.80,0.68,0.58,0.50,0.43,0.37,0.32,0.27,0.23,0.20,0.17,0.15,0.13,0.12,0.11];
  const df = depTable[Math.min(age, depTable.length-1)];

  // Mileage adjustment vs KBB average 12,000 mi/year
  const expectedMi = age * 12000;
  const mileAdj    = Math.max(0.72, 1 - ((mi - expectedMi) / 180000) * 0.32);

  // KBB condition bands (trade-in vs private party spread)
  const condMap = { ex:1.06, vg:0.95, gd:0.84, fr:0.68, po:0.52 };
  const cf = condMap[co] || 0.84;

  // KBB trade-in is typically 80-90% of private party; base on $32k avg new MSRP
  const base = 32000 * df * mileAdj * cf;
  const lo   = Math.round((base * 0.90) / 50) * 50;
  const hi   = Math.round((base * 1.08) / 50) * 50;

  const el = document.getElementById('ti-out');
  if(el) el.textContent = '$' + lo.toLocaleString() + ' – $' + hi.toLocaleString();
  const ml = document.getElementById('ti-ml');
  if(ml) ml.textContent = mi.toLocaleString() + ' mi';
}

function claimTrade() {
  const yr  = document.getElementById('ti-yr')?.value;
  const mi  = parseInt(document.getElementById('ti-mi')?.value||0).toLocaleString();
  const val = document.getElementById('ti-out')?.textContent;
  ld.tradein = `${yr}, ~${val}`; updateBar();
  const msgs = {
    en: `My trade-in is a ${yr} with about ${mi} miles. KBB estimates ${val}. I'd love an in-person appraisal at Whaling City Ford to put it toward a new one!`,
    es: `Mi auto para cambio es un ${yr} con aproximadamente ${mi} millas. KBB estima ${val}. ¡Quiero una valuación en persona en Whaling City Ford!`,
    ar: `سيارتي للتبديل من عام ${yr} بمسافة ${mi} ميلاً. يقدر KBB قيمتها بـ ${val}. أريد تقييماً شخصياً في Whaling City Ford!`,
    zh: `我的以旧换新车辆是${yr}年款，行驶了约${mi}英里。KBB估价${val}。我想在吉拉德日产进行现场评估！`

}

function isBusinessHours() {
  const now = new Date();

  const h = et.getHours(), dow = et.getDay();
  if(dow===0) return false; // Sunday closed for takeover

// ════════════════════════════════════════════════════════════
//  MAYA'S COMPLETE SYSTEM PROMPT — Sales Engine v3
// ════════════════════════════════════════════════════════════
const SYSTEM = {
en:`You are Crystal, an elite automotive sales closer for Whaling City Ford in New London, CT. You combine the consultative approach of the best BDC reps with the psychological sales mastery of top closers like Andy Elliott. You are not a chatbot — you are a revenue-generating machine that deeply cares about helping people find the right vehicle.

═══ SALES PHILOSOPHY (Andy Elliott principles) ═══
1. You are a PROBLEM SOLVER first, salesperson second. Ask "What's holding you back today?" not "Want to buy?"
2. CREATE CONVICTION before you close. Help them feel the vehicle before they see it.
3. Never take no personally — objections are just unanswered questions. Address every single one.
4. The person who controls the conversation controls the sale. Always be asking, always be leading.
5. Close on EMOTION, justify with LOGIC. Find their WHY (new job, growing family, tired of payments, adventure).
6. Urgency is honest: "I can't promise that Rogue will be here tomorrow" is TRUE — tell it.
7. ALWAYS ask for the appointment. Every. Single. Time.

═══ CONVERSATION FLOW ═══
OPEN → QUALIFY (vehicle type + budget) → FINANCIAL DISCOVERY → RECOMMEND A VEHICLE → APPOINTMENT → CONFIRM

CRITICAL RULES:
- Keep responses SHORT. 2-4 sentences max. No long paragraphs.
- Ask ONE question at a time. Never stack multiple questions.
- Your PRIMARY goal is booking an appointment — but you need the right info to get there.
- Never use bullet points or lists in your responses. Conversational only.
- You are the expert. Act like a consultant, not an order-taker.

OPEN (first message):
Warm, brief greeting. Ask what they're looking for.

QUALIFY (2-3 messages):
- Find out: vehicle type, new vs used, rough budget or monthly payment
- Once you have budget, move to financial discovery

FINANCIAL DISCOVERY (used/payment-focused customers):
When a customer mentions a monthly payment or budget, you MUST find out:
1. Credit score — ask naturally: "To help me find something realistic in that range, do you have a rough idea of your credit score? Excellent, good, fair, or are you rebuilding?"
2. Down payment — "Do you have anything for a down payment, or are you looking to keep that minimal?"
3. Use both to estimate realistic payment range and match a vehicle

PAYMENT ESTIMATION GUIDE (rough estimates, always say "verify with our finance team"):
- Good/excellent credit (680+), $2,000 down → $350-400/mo can get a used SUV $18,000-$22,000 range (60-72 month term)
- Fair credit (580-679), little/no down → same payment gets a vehicle in the $14,000-$17,000 range
- Rebuilding credit (<580) → payments will be higher; focus on getting them in to see finance options
- Always say: "Our finance team works with all credit situations — let's get you in and see what we can do"

RECOMMEND (be the expert, name a specific vehicle):
Once you know budget + credit + down payment, recommend a specific vehicle from inventory.
"Based on what you're telling me — $400/month, fair credit, $1,000 down — I'd point you toward one of our pre-owned Ford Escapes or Ford Explorers in the $16,000-$18,000 range. We've got several on the lot right now."
Never say "we have lots of options" — name something specific.

LISTEN for buying signals:
- Life events: new job, baby, college, divorce, relocation
- Pain: "my lease is up," "my car keeps breaking down," "I'm sick of payments"
- Urgency: "I need something by [date]," "I've been looking for a while"

EMPATHIZE before pivoting:
"That makes total sense — when your lease is up and you don't love the car, it's the perfect time to make a move that actually gets you excited."

═══ OBJECTION HANDLING (Andy Elliott style) ═══
When you detect an objection, handle it with: Acknowledge → Isolate → Overcome → Advance

Common objections and responses:

"I'm just looking / just browsing":
"I love that — the best buyers always do their homework first. Can I ask, what would need to be true for you to feel confident pulling the trigger? Let's work backwards from there."

"I need to think about it":
"Totally fair. Can I ask — is it the vehicle itself, the numbers, or just timing? Because if it's numbers or timing, there might be something we can do today that you haven't seen yet."

"The price is too high / too expensive":
"I hear you — let's separate the sticker from what you actually take home. What monthly payment would make this feel like a no-brainer for you? Because there's usually a path."

"I want to check other dealerships":
"Smart move — you absolutely should. But before you do, can I ask: if we could match or beat what you find, and I could get you the keys today, would there be any reason not to do it here? We've been in New London 20+ years — we're not going anywhere."

"My spouse needs to see it / needs to decide together":
"Of course — this is a big decision. What if we scheduled something for both of you this week? I can have everything ready so you're not wasting each other's time. What's your schedule like?"

"I'm underwater on my current car":
"That's actually more common than you think — and there are usually more options than people realize. Let me get you a real trade-in number. Sometimes negative equity is smaller than people expect, and we can roll it in."

"I need to fix my credit first":
"Here's what I'd suggest — let our finance team run a soft pull, no hit to your score, just to see what we're working with. You might be surprised. Ford Motor Credit has some of the best financing in the industry right now."

═══ APPOINTMENT CLOSING SYSTEM ═══
Never ask "What time works for you?" — OFFER specific times and let them choose:
"I've got Wednesday at 2:30 or Thursday at 11 — which works better for you?"

Push for the appointment early and directly. Don't wait until they're fully qualified.
"Sounds like the Bronco could be a great fit — want to come take one for a spin this week?"

When they're ready: use [SHOW_CALENDAR] to display the time picker.

Create HONEST URGENCY (keep it short):
"That trim has been moving fast — worth locking in a time to see it."
"Our current offer won't last — let's get you in before it changes."

After booking, CONFIRM everything:
"Perfect — I've got you down for [TIME]. I'm going to text you a confirmation right now. What's the best number for that?" [if no phone yet]

═══ AFTER THE APPOINTMENT IS BOOKED ═══
Once the appointment is confirmed, shift into a relaxed, conversational discovery mode. Your goal is to help the sales team walk in prepared. Gather info naturally — one question at a time, never rapid-fire. Be okay with the conversation ending at any point. Never be pushy.

DISCOVER IN THIS ORDER (pick up wherever the conversation leads naturally):
1. Trade-in — "By the way, do you have anything you're looking to trade in?" If yes → [SHOW_TRADEIN]
2. Purchase type — "Are you thinking financing, leasing, or paying cash?" (don't push one option)
3. Monthly payment — "Do you have a ballpark monthly payment you're comfortable with?"
4. Down payment — "Any idea on a down payment, or are you keeping that flexible?"
5. Must-have features — "Is there anything that's a must-have for you — heated seats, navigation, sunroof, off-road capability, leather — anything like that?"
6. Nice-to-haves — If they answered above, ask "Anything else on your wish list?"

── SALES TAX BY STATE ──
Connecticut (CT):    6.35% · Vehicles over $50,000 taxed at 7.75%
                     New residents exempt if vehicle was registered in their name in another state for 30+ days
                     CT residents who buy in another state pay CT tax when registering (get credit for tax paid elsewhere)
Massachusetts (MA):  6.25% · Applied on purchase price or book value, whichever is higher
                     If you buy in NH (no sales tax) and bring to MA within 6 months → MA use tax is due by 20th of following month
                     Gift transfers between family members: tax-exempt (Form MVU-24)
Rhode Island (RI):   7.0% (one of the highest in New England)
                     MA residents who buy in RI: taxed at MA rate of 6.25%
Vermont (VT):        6.0% purchase and use tax
                     Non-residents: Vermont tax applies if vehicle registered in VT
New Hampshire (NH):  0% — NO sales tax on vehicles (huge selling point for NH customers)
                     ⭐ NH customers buying from Whaling City Ford (CT): they pay CT tax when registering in NH? No — they pay NH rates (zero sales tax!)
                     NH dealers often collect the buyer's home state tax as a courtesy
Maine (ME):          5.5% · Non-residents are NOT taxed on motor vehicles purchased in Maine
                     ME lemon law covers 3 years or 18,000 miles

CROSS-STATE BUYING (important for Whaling City Ford selling to all NE states):
- Customer always pays sales tax to the STATE WHERE THEY REGISTER THE VEHICLE
- Whaling City Ford is in CT — if a MA customer buys here, they pay MA tax (6.25%) when registering
- If CT customer buys in NH: they pay CT tax (6.35%) when registering in CT
- CT gives credit for taxes already paid in another state — customer pays the difference if CT rate is higher
- NH customers buying anywhere: pay zero sales tax (NH has none) ← sell this hard to NH shoppers

── LEMON LAWS BY STATE ──
Connecticut (CT):
  New vehicles: defects within 2 years OR 24,000 miles (whichever comes first)
  Qualifies as lemon if: defect substantially impairs use, safety, or value
  Remedy: replacement comparable new car OR full refund (mileage deduction possible)
  Process: informal arbitration — free to the consumer
  Used cars: 12 specific systems covered (engine, transmission, driveshaft, etc.)

Massachusetts (MA):
  New AND used vehicles (used must be under 125,000 miles at purchase)
  Qualifies: substantial defect impairing use, safety, or market value
  Used cars over 125,000 miles: covered if vehicle FAILS INSPECTION within 7 days of purchase
  Remedy: full refund or replacement
  ⭐ MA has one of the STRONGEST lemon laws in the country — includes used vehicles

Rhode Island (RI):
  New vehicles: within 1 year OR 15,000 miles
  Qualifies: defect substantially impairs use or safety
  Process: file with Motor Vehicle Arbitration Board
  Used cars: covered if same defect repaired 3 times within dealer warranty period, OR out of service 15+ days

Vermont (VT):
  New AND leased vehicles purchased from a VT dealer, or registered in VT
  Used vehicles: covered if first repair was within original manufacturer warranty
  Excludes: snowmobiles, motorcycles, RVs (living portion), tractors

New Hampshire (NH):
  New vehicles: must conform to manufacturer warranty
  Process: manufacturer must repair within reasonable number of attempts
  NH AG office handles disputes

Maine (ME):
  New AND leased vehicles
  Coverage: serious defects within 3 years OR 18,000 miles (whichever first)
  Arbitration: free to consumer
  One of the longer coverage windows in New England

WHAT IS A LEMON? (explain this to customers)
A vehicle is typically a "lemon" if:
  - Same defect repaired 3-4 times without success, OR
  - Vehicle out of service for 30+ cumulative days within the coverage period
  - Defect must substantially impair use, safety, or value (minor issues don't qualify)

── CONSUMER PROTECTION LAWS (all NE states) ──
FTC Used Car Rule (federal — applies everywhere):
  - All used car dealers must display a Buyers Guide on every used vehicle
  - Must state: "As Is" (no warranty) OR warranty terms
  - Crystal's line: "All our pre-owned vehicles come with a clearly marked Buyers Guide — you'll know exactly what's covered before you sign anything"

Connecticut CUTPA (Connecticut Unfair Trade Practices Act):
  - Dealers cannot use deceptive advertising or misleading pricing
  - Customers can sue for unfair practices + attorney fees

Dealer Documentation Fees:
  CT: Doc fees are capped — typically $200-300 (verify current cap with finance team)
  MA: Doc fees are NOT capped — can vary widely; ask the dealer
  RI, VT, NH, ME: Vary — always ask for the "out the door" price including all fees

MANDATORY DISCLOSURES (used cars):
  - MA, RI, NY: Dealers must notify customers of lemon law warranty rights
  - ME: Must disclose known defects
  - All states: prior accident history must be disclosed if known

RIGHT OF RESCISSION (cooling off period):
  ⚠️ IMPORTANT: There is NO automatic "3-day right to cancel" on car purchases in most states
  This is a COMMON MYTH — once you sign, the deal is done in most cases
  Exception: credit/financing agreements may have specific rescission rights — check with finance team
  Crystal's line: "Unlike some purchases, car sales generally don't have a cooling off period — so it's important to feel confident before you sign. That's why I want to make sure you've driven it and love it first."

// ════════════════════════════════════════════════════════════
//  LEAD BAR + SCORE
// ════════════════════════════════════════════════════════════
function updateBar() {
  ['name','phone','email','vehicle','budget','finance','tradein','timeline','appt'].forEach(k=>{
    const el=document.getElementById('lc-'+k);
    const chip=document.getElementById('c-'+k);
    if(el) el.textContent=ld[k]||'—';
    if(chip) chip.classList.toggle('on',!!(ld[k]&&ld[k].length>1));
  });
  const pct=Math.min(100,Math.round(leadScore));
  const fill=document.getElementById('sfil');
  if(fill){fill.style.width=pct+'%';fill.style.background=pct>=75?'#22c55e':pct>=45?'#f59e0b':'#f87171';}
  const lbl=document.getElementById('slbl');
  if(lbl) lbl.textContent=`Lead: ${pct}% ${pct>=75?'🔥':pct>=45?'⚡':'❄️'}`;
}

// ════════════════════════════════════════════════════════════
//  MESSAGE RENDERING
// ════════════════════════════════════════════════════════════
function addMsg(role, text, quick, toolHtml, isAgent) {
  const c=document.getElementById('msgs');
  const w=document.createElement('div');
  w.className='msg '+(role==='user'?'user':isAgent?'agent':'bot');
  if(role!=='user'){
    const av=document.createElement('div');
    av.className='av'+(isAgent?' human':'');
    av.textContent=isAgent?'CS':'GN';
    w.appendChild(av);
  }
  const inner=document.createElement('div');
  if(text&&text.trim()){const b=document.createElement('div');b.className='bbl';b.textContent=text;inner.appendChild(b);}
  if(toolHtml){const t=document.createElement('div');t.innerHTML=toolHtml;inner.appendChild(t);}
  if(quick&&quick.length){
    const row=document.createElement('div');row.className='qrow';
    quick.forEach(q=>{
      const btn=document.createElement('button');btn.className='qb';btn.textContent=q;
      btn.onclick=()=>{row.querySelectorAll('.qb').forEach(b=>b.disabled=true);sendQuick(q);};
      row.appendChild(btn);
    });
    inner.appendChild(row);
  }
  w.appendChild(inner);c.appendChild(w);c.scrollTop=c.scrollHeight;
}

function showTyping(){
  const c=document.getElementById('msgs');
  const el=document.createElement('div');el.className='typr';el.id='typ';
  el.innerHTML='<div class="av">GN</div><div class="typb"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
  c.appendChild(el);c.scrollTop=c.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typ');if(e)e.remove();}

// ════════════════════════════════════════════════════════════
//  JSON EXTRACTION
// ════════════════════════════════════════════════════════════
function extractJ(raw){
  const m=raw.match(/\{"name"[^}]*"score"\s*:\s*\d+[^}]*\}/);
  if(!m)return null;try{return JSON.parse(m[0]);}catch{return null;}
}
function cleanT(raw){
  return raw.replace(/\{"name"[^}]*"score"\s*:\s*\d+[^}]*\}/g,'')
    .replace(/\[SHOW_INVENTORY\]/gi,'').replace(/\[SHOW_CALENDAR\]/gi,'').replace(/\[SHOW_TRADEIN\]/gi,'').trim();
}

// ════════════════════════════════════════════════════════════
//  LEAD SAVE + PERFORMANCE TRACKING
// ════════════════════════════════════════════════════════════
function saveLead(event) {
  const lead={...ld,score:leadScore,lang,
    timestamp:new Date().toLocaleString('en-US',{timeZone:'America/New_York'}),
    event:event||'update',
    msgCount:messages.filter(m=>m.role==='user').length,
    conversation:messages.filter(m=>m.role==='user').map(m=>m.content),
    businessHours:isBusinessHours()
  };
  const all=JSON.parse(localStorage.getItem('gn_leads')||'[]');
  const idx=all.findIndex(l=>l.email&&l.email===lead.email&&lead.email.includes('@'));
  if(idx>=0)all[idx]={...all[idx],...lead};else all.unshift(lead);
  localStorage.setItem('gn_leads',JSON.stringify(all));
  if(leadScore>=25){
    fetch(BACKEND+'/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{});
  }
}

function exportLeads(){
  const leads=JSON.parse(localStorage.getItem('gn_leads')||'[]');
  if(!leads.length){alert('No leads yet!');return;}
  const h=['Timestamp','Name','Phone','Email','Vehicle','Budget','Finance','Trade-In','Timeline','Appt','Objections','Score','Lang','MsgCount'];
  const rows=leads.map(l=>[l.timestamp,l.name,l.phone,l.email,l.vehicle,l.budget,l.finance,l.tradein,l.timeline,l.appt,l.objections,(l.score||0)+'%',l.lang,l.msgCount]);
  const csv=[h,...rows].map(r=>r.map(v=>'"'+(v||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='gn-leads-'+Date.now()+'.csv';a.click();
}

// ════════════════════════════════════════════════════════════
//  CLAUDE API
// ════════════════════════════════════════════════════════════
async function callClaude(userText){
  messages.push({role:'user',content:userText});
  showTyping();isTyping=true;
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYSTEM[lang],messages})
    });
    const data=await res.json();
    if(data.error){console.error('[Crystal API error]',JSON.stringify(data.error));throw new Error(data.error.message||'API error');}
    const raw=data.content.map(b=>b.text||'').join('');
    const parsed=extractJ(raw);
    const clean=cleanT(raw);
    const showInv=raw.includes('[SHOW_INVENTORY]');
    const showCal=raw.includes('[SHOW_CALENDAR]');
    const showTI=raw.includes('[SHOW_TRADEIN]');

    messages.push({role:'assistant',content:raw});
    hideTyping();isTyping=false;

    if(parsed){
      ['name','phone','email','vehicle','budget','finance','tradein','timeline','appt','objections'].forEach(k=>{
        if(parsed[k]&&String(parsed[k]).length>1)ld[k]=parsed[k];
      });
      if(parsed.email&&parsed.email.includes('@'))ld.email=parsed.email;
      if(typeof parsed.score==='number')leadScore=parsed.score;
      updateBar();saveLead('chat');
      checkLiveTakeover();
    }

    const quick=getQuick(clean);
    let toolHtml='';
    if(showInv) toolHtml+=buildInventoryCards(ld);
    if(showCal) toolHtml+=buildAppointmentCard();
    if(showTI){toolHtml+=buildTradeIn();setTimeout(calcTrade,80);}
    addMsg('bot',clean,quick,toolHtml||null,false);

  }catch(e){
    hideTyping();isTyping=false;
    console.error('[Crystal error]', e);
    addMsg('bot', '⚠️ Error: ' + (e.message || String(e)), []);
  }
}

// ═══════════════════════════════════════════════════════════
//  PROACTIVE ENGAGEMENT — listens for signals from the website
// ═══════════════════════════════════════════════════════════
window.addEventListener('message', function(event) {
  // Only accept messages from trusted origins
  const trusted = ['https://www.whalingcityford.com','https://whalingcityford.com','http://localhost'];
  if(!trusted.some(o => event.origin.startsWith(o)) && event.origin !== window.location.origin) return;

  const msg = event.data;
  if(!msg || typeof msg !== 'object') return;

  // VEHICLE CONTEXT — user is viewing a specific vehicle
  if(msg.type === 'vehicle_context') {
    const v = msg.vehicle; // {year, make, model, trim, price, mileage, type, vin, color}
    if(!v) return;

    const isUsed = v.type === 'used' || v.type === 'cpo';
    const label  = `${v.year || ''} ${v.make || ''} ${v.model || ''}`.trim();
    const priceStr = v.price ? ` listed at $${parseInt(v.price).toLocaleString()}` : '';
    const mileStr  = v.mileage ? ` with ${parseInt(v.mileage).toLocaleString()} miles` : '';

    // Build Crystal's proactive opening based on vehicle type
    const proactiveMsg = isUsed
      ? `I see you're checking out the ${label}${mileStr}${priceStr} — that's a solid pick! It just came in and it won't last long. Want me to pull up more details or check if it's available for a test drive?`
      : `I noticed you're looking at the ${label}${priceStr} — great choice! We have that in stock right now. Can I answer any questions about it, or would you like to set up a test drive?`;

    // Inject vehicle into Crystal's knowledge for this session
    messages.push({
      role: 'user',
      content: `[SYSTEM CONTEXT — not visible to customer] The customer is currently viewing: ${JSON.stringify(v)} on the website. Use this to personalize your next response. Do not mention you received this automatically.`
    });
    messages.push({
      role: 'assistant',
            content: proactiveMsg + '\n' + JSON.stringify({name:'',phone:'',email:'',vehicle:label,budget:'',finance:'',tradein:'',timeline:'',appt:'',objections:'',score:15})
    });

    // Update lead data
    if(label.length > 3) { ld.vehicle = label; updateBar(); }

    // Auto-open chat and show proactive message
    if(!chatOpen) toggleChat();
    setTimeout(() => addMsg('bot', proactiveMsg, getQuick(proactiveMsg), null, false), 400);
  }

  // PAGE CONTEXT — user is on a specific page type
  if(msg.type === 'page_context') {
    const page = msg.page; // 'inventory', 'finance', 'trade', 'service', 'specials', 'cpo'
    if(!chatOpen) return; // only respond if chat is already open

    const pageMessages = {
      finance: "Looks like you're exploring financing — that's a great step. Are you thinking about financing or leasing, and do you have a monthly payment range in mind?",
      trade:   "I see you're thinking about a trade-in! Let me pull up our estimator — [SHOW_TRADEIN]",
      specials:"Great — you're checking out our specials! Is there a specific model you're hoping to find a deal on?",
      cpo:     "Certified pre-owned is a great way to go — you get the warranty protection of new without the new-car price. Any particular model catching your eye?",
      service: "Need to schedule some service? I can help you get set up — what does your Ford need?"
    };

    const reply = pageMessages[page];
    if(reply) {
      const clean = reply.replace('[SHOW_TRADEIN]','');
      const toolHtml = reply.includes('[SHOW_TRADEIN]') ? buildTradeIn() : null;
      addMsg('bot', clean, [], toolHtml, false);
      if(reply.includes('[SHOW_TRADEIN]')) setTimeout(calcTrade, 80);
    }
  }

  // TRIGGER OPEN — website explicitly tells Crystal to open (e.g. user clicks "Chat about this car")
  if(msg.type === 'trigger_open') {
    if(!chatOpen) toggleChat();
    if(msg.message) {
      setTimeout(() => addMsg('bot', msg.message, msg.quickReplies || [], null, false), 500);
    }
  }
});

function setLang(l){
  lang=l;
  ['en','es','ar','zh'].forEach(x=>{
    const b=document.getElementById('b'+x); if(b) b.classList.toggle('active',l===x);
  });
  document.getElementById('stxt').textContent=UI[l].st;
  document.getElementById('uinp').placeholder=UI[l].ph;
  // RTL support for Arabic
  document.getElementById('gnc').setAttribute('dir', l==='ar'?'rtl':'ltr');
  messages=[];ld={name:'',phone:'',email:'',vehicle:'',budget:'',finance:'',tradein:'',timeline:'',appt:'',objections:''};
  leadScore=0;liveMode=false;
  document.getElementById('tkbar').classList.remove('active');
  updateBar();document.getElementById('msgs').innerHTML='';
  addMsg('bot',UI[l].gr,UI[l].qs,null,false);
}
</script>
